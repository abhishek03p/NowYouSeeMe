<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now You See Me - Video Calling</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%23764ba2'>🎥</text></svg>">
    <!-- Adding FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #121212;
            --secondary-bg: #1e1e2e;
            --accent-color: #764ba2;
            --accent-hover: #667eea;
            --text-main: #ffffff;
            --text-dim: #b0b0b0;
            --error-red: #ff5252;
            --success-green: #4caf50;
            --chat-bubble-sent: #764ba2;
            --chat-bubble-received: #2a2a3d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--primary-bg);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            flex-direction: column;
        }

        .header {
            background: var(--secondary-bg);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .meeting-info {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .meeting-id {
            font-size: 14px;
            color: var(--text-dim);
        }

        .meeting-id strong {
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .copy-btn {
            background: none;
            border: none;
            color: var(--accent-hover);
            cursor: pointer;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: rgba(102, 126, 234, 0.1);
            transform: scale(1.05);
        }

        .main-content {
            flex: 1;
            display: flex;
            gap: 15px;
            padding: 15px;
            overflow: hidden;
        }

        .video-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 15px;
            overflow-y: auto;
            align-content: start;
        }

        .video-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16/9;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .video-label::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--success-green);
            border-radius: 50%;
        }

        /* Modern Chat Panel */
        .chat-panel {
            width: min(360px, 32vw);
            background: var(--secondary-bg);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            transition: transform 0.3s ease;
            position: relative;
        }

        .chat-header {
            padding: 18px 20px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(0, 0, 0, 0.1);
            scrollbar-width: thin;
            scrollbar-color: var(--accent-color) transparent;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 10px;
        }

        .message-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }

        .message-bubble.sent {
            align-self: flex-end;
            background: var(--chat-bubble-sent);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-bubble.received {
            align-self: flex-start;
            background: var(--chat-bubble-received);
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .message-info {
            font-size: 11px;
            margin-bottom: 4px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
        }

        .sent .message-info {
            justify-content: flex-end;
        }

        .file-message-content {
            margin-top: 8px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .file-message-content img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }

        .file-message-content a {
            color: var(--accent-hover);
            text-decoration: none;
            font-weight: 500;
        }

        .file-message-content a:hover {
            text-decoration: underline;
        }

        /* Chat Input Tools */
        .chat-tools {
            display: flex;
            gap: 10px;
            padding: 5px 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tool-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
            transition: color 0.2s;
        }

        .tool-btn:hover {
            color: var(--accent-hover);
        }

        .chat-input-area {
            padding: 12px 15px 20px 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .chat-input {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 14px;
            outline: none;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .chat-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-color);
        }

        .send-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .send-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        /* Panels for Emojis */
        .expansion-panel {
            position: static;
            width: calc(100% - 20px);
            margin: 0 10px 8px;
            background: var(--secondary-bg);
            border-radius: 12px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
            display: none;
            z-index: 20;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            max-height: 260px;
            overflow-y: auto;
        }

        .emoji-item {
            font-size: 20px;
            cursor: pointer;
            text-align: center;
            padding: 5px;
            border-radius: 4px;
        }

        .emoji-item:hover {
            background: rgba(255,255,255,0.1);
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            background: rgba(30, 30, 46, 0.8);
            backdrop-filter: blur(12px);
            padding: 12px 25px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            transition: all 0.2s;
        }

        .control-btn.toggle-video { background: #444; }
        .control-btn.toggle-video:hover { background: #555; }
        .control-btn.toggle-video.off { background: var(--error-red); }

        .control-btn.toggle-audio { background: #444; }
        .control-btn.toggle-audio:hover { background: #555; }
        .control-btn.toggle-audio.off { background: var(--error-red); }

        .control-btn.end-call {
            background: var(--error-red);
            width: 65px;
            border-radius: 30px;
        }

        .control-btn.end-call:hover {
            background: #ff3333;
            transform: scale(1.05);
        }

        .notification {
            position: fixed;
            top: 25px;
            right: 25px;
            background: var(--secondary-bg);
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border-left: 4px solid var(--accent-color);
            z-index: 1000;
            animation: slideIn 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        .notification.error {
            border-left-color: var(--error-red);
        }

        .notification.success {
            border-left-color: var(--success-green);
        }

        .notification.info {
            border-left-color: var(--accent-color);
        }

        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 1200px) {
            .chat-panel { width: min(340px, 36vw); }
            .video-grid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
        }

        @media (max-width: 900px) {
            .header {
                padding: 12px 14px;
                gap: 10px;
            }

            .header h1 {
                font-size: 18px;
            }

            .meeting-info {
                padding: 6px 10px;
                gap: 8px;
            }

            .chat-panel { width: min(300px, 40vw); }
            .video-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
        }

        @media (max-width: 768px) {
            body { overflow: auto; }

            .container {
                min-height: 100dvh;
                height: auto;
            }

            .main-content {
                flex-direction: column;
                gap: 10px;
                padding: 10px;
                overflow: visible;
            }

            .video-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .chat-panel {
                width: 100%;
                height: min(42dvh, 420px);
                border-radius: 12px;
            }

            .chat-header {
                padding: 12px 14px;
            }

            .chat-messages {
                padding: 10px;
            }

            .chat-input-area {
                padding: 10px 10px 14px 10px;
            }

            .controls {
                position: sticky;
                left: auto;
                bottom: 0;
                transform: none;
                margin: 8px auto 14px;
                width: fit-content;
                max-width: calc(100vw - 20px);
                padding: 10px 14px;
                gap: 12px;
            }
        }

        @media (max-width: 480px) {
            .header {
                flex-direction: column;
                align-items: stretch;
            }

            .header h1 {
                font-size: 17px;
                text-align: center;
            }

            .meeting-info {
                justify-content: space-between;
            }

            .meeting-id {
                font-size: 12px;
            }

            .control-btn {
                width: 44px;
                height: 44px;
                font-size: 16px;
            }

            .control-btn.end-call {
                width: 54px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-video"></i> NYSM</h1>
            <div class="meeting-info">
                <span class="meeting-id">Meeting ID: <strong id="meetingId">...</strong></span>
                <button class="copy-btn" onclick="copyMeetingId()" title="Copy Invite Link">
                    <i class="far fa-copy"></i>
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="video-grid" id="videoGrid"></div>

            <div class="chat-panel" id="chatPanel">
                <div class="chat-header">
                    <span><i class="far fa-comments"></i> Chat</span>
                    <i class="fas fa-chevron-down" style="cursor: pointer; opacity: 0.5;"></i>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <!-- Example Bubble -->
                    <div class="message-bubble received">
                        <div class="message-info">System • Now</div>
                        Welcome to the meeting! Have a great call.
                    </div>
                </div>

                <!-- Expansion Panels -->
                <div id="emojiPanel" class="expansion-panel">
                    <div class="emoji-grid" id="emojiGrid"></div>
                </div>

                <div class="chat-tools">
                    <button class="tool-btn" onclick="togglePanel('emojiPanel')" title="Emojis">
                        <i class="far fa-smile"></i>
                    </button>
                    <button class="tool-btn" onclick="triggerFileInput()" title="Share File">
                        <i class="fas fa-paperclip"></i>
                    </button>
                    <input type="file" id="fileInput" style="display: none;">
                </div>

                <div class="chat-input-area">
                    <div class="input-wrapper">
                        <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." autocomplete="off">
                    </div>
                    <button class="send-btn" onclick="sendChatMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn toggle-video" id="videoBtn" onclick="toggleVideo()" title="Camera (V)">
                <i class="fas fa-video"></i>
            </button>
            <button class="control-btn toggle-audio" id="audioBtn" onclick="toggleAudio()" title="Microphone (A)">
                <i class="fas fa-microphone"></i>
            </button>
            <button class="control-btn end-call" onclick="endCall()" title="Leave Call (Q)">
                <i class="fas fa-phone-slash"></i>
            </button>
        </div>
    </div>

    <script src="/js/webrtc-client.js"></script>
    <script th:inline="javascript">
        // UI specific logic
        function togglePanel(panelId) {
            const panels = ['emojiPanel']; // Only emoji panel now
            panels.forEach(p => {
                const el = document.getElementById(p);
                if (p === panelId) {
                    const shouldShow = el.style.display !== 'block';
                    el.style.display = shouldShow ? 'block' : 'none';
                    if (p === 'emojiPanel' && shouldShow) {
                        renderEmojiGrid(emojis); // Render static emojis
                    }
                } else {
                    el.style.display = 'none';
                }
            });
        }

        // Static Emojis
        const emojis = ['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😗','😙','😚','😋','😛','😝','😜','🤪','🤨','🧐','🤓','😎','🤩','🥳','😏','😒','😞','😔','😟','😕','🙁','☹️','😣','😖','😫','😩','🥺','😢','😭','😤','😠','😡','🤬','🤯','😳','🥵','🥶','😱','😨','😰','😥','😓','🤗','🤔','🤭','🤫','🤥','😶','😐','😑','😬','🙄','😯','😦','😧','😮','😲','🥱','😴','🤤','😪','😵','🤐','🥴','🤢','🤮','🤧','🤨','🧐','🤓'];
        const emojiGrid = document.getElementById('emojiGrid');

        function renderEmojiGrid(emojisToRender) {
            emojiGrid.innerHTML = '';
            emojisToRender.forEach(emoji => {
                const span = document.createElement('span');
                span.className = 'emoji-item';
                span.textContent = emoji;
                span.onclick = () => {
                    const input = document.getElementById('chatInput');
                    input.value += emoji;
                    input.focus();
                };
                emojiGrid.appendChild(span);
            });
        }

        // Initial render of emojis when panel is first opened
        // Or you can call renderEmojiGrid(emojis) directly here if you want it always visible
        // For now, it will render when togglePanel('emojiPanel') is called.

    </script>
</body>
</html>
