<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now You See Me - Video Calling</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%23764ba2'>🎥</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .option-card {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .option-card:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }
        .option-card h2 {
            font-size: 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .option-card p {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 15px;
        }
        .btn {
            padding: 10px 20px;
            background: #667eea;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
            width: 100%;
        }
        .btn:hover {
            background: #5568d3;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .join-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        .join-section h3 {
            font-size: 14px;
            margin-bottom: 15px;
            opacity: 0.9;
            text-align: center;
        }
        .input-group {
            display: flex;
            gap: 8px;
        }
        .input-group input {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            font-size: 14px;
            font-weight: 500;
        }
        .input-group input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #667eea;
        }
        .input-group button {
            padding: 10px 20px;
            background: #4caf50;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .input-group button:hover {
            background: #45a049;
        }
        .error {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
        }
        .loading {
            display: none;
            text-align: center;
            font-size: 14px;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
            .header h1 {
                font-size: 32px;
            }
            .option-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📹 Now You See Me</h1>
            <p>Video calling made simple</p>
        </div>

        <div class="options" id="optionsContainer">
            <div class="option-card" onclick="startNewMeeting()">
                <h2>➕ Start New Meeting</h2>
                <p>Create a new meeting room and invite others</p>
                <button class="btn">Start Meeting</button>
            </div>

            <div class="option-card" onclick="showJoinForm()">
                <h2>🔗 Join Meeting</h2>
                <p>Join an existing meeting using a code</p>
                <button class="btn">Join Meeting</button>
            </div>
        </div>

        <div class="join-section" id="joinSection" style="display: none;">
            <h3>Enter Meeting Code</h3>
            <div class="input-group">
                <input
                    type="text"
                    id="meetingCode"
                    placeholder="e.g., ABC12345"
                    maxlength="20"
                    onkeypress="if(event.key==='Enter') joinMeeting()"
                />
                <button onclick="joinMeeting()">Join</button>
            </div>
            <div class="error" id="errorMsg"></div>
        </div>

        <div class="loading" id="loadingState">
            <div class="spinner"></div>
            <span id="loadingText">Preparing meeting...</span>
        </div>
    </div>

    <script>
        // Check if redirected with a meetingId
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const meetingId = params.get('meetingId');
            if (meetingId) {
                showLoading(true, 'Joining meeting...');
                verifyAndJoin(meetingId);
            }
        };

        function startNewMeeting() {
            showLoading(true, 'Creating meeting...');

            fetch('/api/meetings/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(res => res.json())
            .then(data => {
                window.location.href = `/meeting?meetingId=${data.meetingId}`;
            })
            .catch(err => {
                showLoading(false);
                showError('Failed to create meeting: ' + err.message);
            });
        }

        function showJoinForm() {
            const section = document.getElementById('joinSection');
            section.style.display = section.style.display === 'none' ? 'block' : 'none';
            if (section.style.display === 'block') {
                document.getElementById('meetingCode').focus();
            }
        }

        function joinMeeting() {
            const code = document.getElementById('meetingCode').value.trim().toUpperCase();

            if (!code) {
                showError('Please enter a meeting code');
                return;
            }

            showLoading(true, 'Joining meeting...');
            verifyAndJoin(code);
        }

        function verifyAndJoin(code) {
            // Verify meeting exists
            fetch(`/api/meetings/${code}/exists`)
                .then(res => res.json())
                .then(data => {
                    if (data.exists) {
                        window.location.href = `/meeting?meetingId=${code}`;
                    } else {
                        showLoading(false);
                        showError('Meeting not found. Please check the code.');
                        document.getElementById('meetingCode').value = '';
                        // Clear the URL if it had an invalid meetingId
                        window.history.replaceState({}, document.title, "/");
                    }
                })
                .catch(err => {
                    showLoading(false);
                    showError('Error: ' + err.message);
                });
        }

        function showError(msg) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = msg;
            setTimeout(() => {
                errorDiv.textContent = '';
            }, 5000);
        }

        function showLoading(show, text) {
            document.getElementById('loadingState').style.display = show ? 'flex' : 'none';
            document.getElementById('optionsContainer').style.display = show ? 'none' : 'flex';
            document.getElementById('joinSection').style.display = 'none';
            if (text) {
                document.getElementById('loadingText').textContent = text;
            }
        }
    </script>
</body>
</html>
